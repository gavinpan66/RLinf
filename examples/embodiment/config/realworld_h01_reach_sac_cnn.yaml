# A real GigaAI Maker H01 upper body reached by its own MCP server.
#
# The training host talks to the robot only through
# http://<robot>:8100/mcp. Replace the endpoint below with the address of the
# machine running ~/h01_mcp/server.py.
defaults:
  - env/h01_reach@env.train
  - env/h01_reach@env.eval
  - model/cnn_policy@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,rollout: 0
    # The env worker must sit in the group that carries the robot, or it is
    # handed a bare HardwareInfo and cannot find it.
    env:
      node_group: h01
      placement: 0
  node_groups:
    - label: h01
      node_ranks: 0
      hardware:
        type: H01
        configs:
          - node_rank: 0
            endpoint: http://172.16.72.30:8100/mcp
            camera: head
            camera_width: 320
            camera_quality: 75
            # Radians one step may move a joint. Raise it only once the task
            # is known to be safe at the slower rate.
            max_step_delta: 0.1

runner:
  task_type: embodied
  logger:
    log_path: /tmp/rlinf_h01_reach
    project_name: rlinf
    experiment_name: "h01-reach"
    logger_backends: ["tensorboard"]

  max_epochs: 10
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

algorithm:
  update_epoch: 10
  group_size: 1
  agg_q: min

  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  bootstrap_type: always
  gamma: 0.9
  tau: 0.01

  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.01
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    sample_window_size: 200
    min_buffer_size: 0
    auto_save: True

  target_update_freq: 1

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      use_dense_reward: True
      step_frequency: 10.0
      max_num_steps: 30
      # Radians, both arms in action order. null holds the pose measured when
      # the environment starts; set a goal here to make the task a real reach.
      reset_joint_qpos: null
      target_joint_qpos: null
      # Observe the head and waist; command them only for a task that needs it.
      control_head: False
      control_waist: False
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 30
    max_steps_per_rollout_epoch: 30

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    override_cfg:
      is_dummy: False
      use_dense_reward: True
      max_num_steps: 30

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  model:
    model_path: ""
    precision: ${actor.model.precision}

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 64
  global_batch_size: 64
  seed: 1234
  enable_offload: False

  model:
    model_type: cnn_policy
    model_path: ""
    # Fourteen arm joints plus two gripper openings. The head and the waist are
    # observed but held, so they stay out of the action vector.
    action_dim: 16
    # Fourteen arm joints, two grippers, two head joints, four waist joints.
    state_dim: 22
    image_size: [3, 128, 128]
    num_action_chunks: 1
    precision: "32"
    add_value_head: False
    add_q_head: True

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
