env_type: real
total_num_envs: null

auto_reset: True
ignore_terminations: True
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 50
max_episode_steps: 30
# The H01 server exposes no leader device for teleoperation.
teleop: none
keyboard_intervention_wrapper: False
# Both end effectors are grippers, so the no-gripper arm flag does not apply.
no_gripper: False
main_image_key: head

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "H01ReachEnv-v1"
  num_envs: null
